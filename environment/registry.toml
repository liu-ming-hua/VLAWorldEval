# Paths are relative to the VLAWorldEval project root unless absolute.
# Legacy WorldGym pairs can share a VLA interpreter. Incompatible runtimes
# use isolated workers; registry availability is not pair acceptance.

[environments.framework.core]
path = "environment/core"
status = "configured"
scope = "framework"
package_profile = "core-py311"
notes = "Lightweight locked CLI environment; does not install any model stack."

[environments.evaluators.video]
path = "environment/evaluators/video"
status = "configured"
scope = "evaluator"
package_profile = "lpips-vgg-video-metrics"
notes = "Optional isolated CPU LPIPS, pinned EWMBench gripper detector and skimage checks. Evaluator assets are verified separately; cross-domain detection requires coverage and calibration review. No policy/world-model loading or cloud scoring."

