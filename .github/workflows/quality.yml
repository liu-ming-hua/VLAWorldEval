name: framework-quality

on:
  push:
  pull_request:

jobs:
  weight-free:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install framework test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r environment/locks/engineering-tools-py311.txt -r environment/locks/build-tools-py311.txt build==1.3.0
          python -m pip install -e .
      - name: Install video tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run project quality gate
        run: |
          if bash scripts/check_project.sh > "$RUNNER_TEMP/framework-quality.log" 2>&1; then
            cat "$RUNNER_TEMP/framework-quality.log"
          else
            cat "$RUNNER_TEMP/framework-quality.log"
            python -c 'import os; from pathlib import Path; text=(Path(os.environ["RUNNER_TEMP"])/"framework-quality.log").read_text()[-12000:]; text=text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error title=Project quality gate::"+text)'
            exit 1
          fi
      - name: Build and test installed wheel away from checkout
        run: |
          python -m build
          python -m pip install --no-deps --target "$RUNNER_TEMP/installed" dist/vlaworldeval-*.whl
          cd "$RUNNER_TEMP"
          export PYTHONPATH="$RUNNER_TEMP/installed"
          python -c "import cli, importlib.util; assert '/installed/' in cli.__file__; assert importlib.util.find_spec('torch') is None"
          python -m cli demo --output "$RUNNER_TEMP/cpu-demo" --chunks 30
          python -m cli inspect --artifact "$RUNNER_TEMP/cpu-demo"
          python -m cli init --directory "$RUNNER_TEMP/asset-workspace"
          export VLAWORLDEVAL_ROOT="$RUNNER_TEMP/asset-workspace"
          python -m cli validate
          python -m cli configure --config configs/experiments/openvla_worldgym_v1.json --output configs/experiments/ci_machine.json --vla-gpus 2 --wm-gpus 3 --chunks 40
          python "$GITHUB_WORKSPACE/scripts/acceptance/installed_core_smoke.py" --output "$RUNNER_TEMP/installed-workers"
      - name: Check source-distribution setup resources
        run: |
          python -c "import glob, tarfile; from scripts.acceptance.export_source import PRESENTATION_ASSETS; p=glob.glob('dist/*.tar.gz')[0]; names=tarfile.open(p).getnames(); media=tuple('/'+p for p in PRESENTATION_ASSETS if p.endswith('.mp4')); assert any(n.endswith('/environment/locks/core-py311.txt') for n in names); assert any(n.endswith('/scripts/setup/common.sh') for n in names); assert any(n.endswith('/docs/assets/framework.png') for n in names); assert not any('/site-packages/' in n or n.endswith(('.safetensors','.pt','.npz')) or n.endswith('.mp4') and not n.endswith(media) for n in names)"
      - name: Validate GitHub source export
        run: |
          python scripts/acceptance/export_source.py --sdist dist/*.tar.gz --output "$RUNNER_TEMP/github-source"
          cd "$RUNNER_TEMP/github-source"
          python -c "import cli; from pathlib import Path; assert Path(cli.__file__).resolve().is_relative_to(Path.cwd())"
          python -m cli validate
